name: Release

# Publishes to PyPI when a GitHub release is published.
# Uses PyPI trusted publishing (OIDC): no API token or password is stored anywhere.
# One-time setup on pypi.org: add a trusted publisher for this repo, workflow
# "release.yml", environment "pypi".

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tag must match the package version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          code=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/sqlsentry/__init__.py').read()).group(1))")
          echo "tag=${GITHUB_REF_NAME} pyproject=$v __version__=$code"
          [ "v$v" = "${GITHUB_REF_NAME}" ] && [ "$v" = "$code" ] || { echo "::error::version mismatch"; exit 1; }

      - name: Build and validate
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - name: Smoke-test the built wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install "$(ls dist/*.whl)[server,mcp]"
          cd "$(mktemp -d)"
          /tmp/smoke/bin/sqlsentry --version
          /tmp/smoke/bin/sqlsentry-mcp --version
          /tmp/smoke/bin/sqlsentry init
          /tmp/smoke/bin/sqlsentry inspect store | grep -q "TABLE customers"
          if /tmp/smoke/bin/sqlsentry validate store "DELETE FROM orders"; then
            echo "::error::guard accepted a DELETE"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sqlsentry/
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
